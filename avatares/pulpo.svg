<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Fondo degradado circular para avatar -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#E0F7FA" />
      <stop offset="70%" stop-color="#80DEEA" />
      <stop offset="100%" stop-color="#4DD0E1" />
    </radialGradient>
    
    <!-- Degradado cuerpo pulpo -->
    <linearGradient id="octopus-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BA68C8" />
      <stop offset="50%" stop-color="#9C27B0" />
      <stop offset="100%" stop-color="#7B1FA2" />
    </linearGradient>

    <!-- Sombras suaves -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#4A148C" flood-opacity="0.25" />
    </filter>

    <filter id="tentacle-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#2A0845" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Marco circular del Avatar -->
  <circle cx="250" cy="250" r="230" fill="url(#bg-grad)" stroke="#FFFFFF" stroke-width="12" />
  
  <!-- Detalle del agua: burbujas flotantes -->
  <circle cx="100" cy="120" r="14" fill="#FFFFFF" opacity="0.5" />
  <circle cx="110" cy="110" r="5" fill="#FFFFFF" opacity="0.8" />
  <circle cx="390" cy="160" r="18" fill="#FFFFFF" opacity="0.4" />
  <circle cx="400" cy="148" r="7" fill="#FFFFFF" opacity="0.7" />
  <circle cx="370" cy="280" r="10" fill="#FFFFFF" opacity="0.4" />
  <circle cx="120" cy="340" r="12" fill="#FFFFFF" opacity="0.4" />

  <g filter="url(#soft-shadow)">
    <!-- Tentáculos traseros (profundidad) -->
    <g fill="none" stroke="#6A1B9A" stroke-linecap="round">
      <path d="M 170 340 Q 130 410 80 370 Q 50 340 85 310" stroke-width="32" />
      <path d="M 330 340 Q 370 410 420 370 Q 450 340 415 310" stroke-width="32" />
    </g>

    <!-- Ventosas traseras -->
    <circle cx="70" cy="350" r="8" fill="#E1BEE7" />
    <circle cx="95" cy="380" r="9" fill="#E1BEE7" />
    <circle cx="430" cy="350" r="8" fill="#E1BEE7" />
    <circle cx="405" cy="380" r="9" fill="#E1BEE7" />

    <!-- Tentáculos principales delanteros -->
    <!-- Tentáculo 1 (Izquierda exterior) -->
    <path d="M 150 330 C 100 360 90 440 140 440 C 190 440 170 380 175 360" fill="url(#octopus-grad)" stroke="#4A148C" stroke-width="6" stroke-linejoin="round" />
    
    <!-- Tentáculo 2 (Izquierda centro) -->
    <path d="M 195 350 C 170 410 200 460 230 450 C 260 440 235 380 230 360" fill="url(#octopus-grad)" stroke="#4A148C" stroke-width="6" stroke-linejoin="round" />

    <!-- Tentáculo 3 (Derecha centro) -->
    <path d="M 305 350 C 330 410 300 460 270 450 C 240 440 265 380 270 360" fill="url(#octopus-grad)" stroke="#4A148C" stroke-width="6" stroke-linejoin="round" />

    <!-- Tentáculo 4 (Derecha exterior) -->
    <path d="M 350 330 C 400 360 410 440 360 440 C 310 440 330 380 325 360" fill="url(#octopus-grad)" stroke="#4A148C" stroke-width="6" stroke-linejoin="round" />

    <!-- Cabeza / Cuerpo Principal -->
    <path d="M 140 260 C 140 120 360 120 360 260 C 360 330 340 365 250 365 C 160 365 140 330 140 260 Z" fill="url(#octopus-grad)" stroke="#4A148C" stroke-width="7" />

    <!-- Ventosas delanteras (detalles amarillos/rosados divertidos) -->
    <circle cx="125" cy="415" r="9" fill="#F8BBD0" stroke="#4A148C" stroke-width="3" />
    <circle cx="150" cy="425" r="7" fill="#F8BBD0" stroke="#4A148C" stroke-width="3" />
    <circle cx="375" cy="415" r="9" fill="#F8BBD0" stroke="#4A148C" stroke-width="3" />
    <circle cx="350" cy="425" r="7" fill="#F8BBD0" stroke="#4A148C" stroke-width="3" />
    
    <circle cx="215" cy="425" r="8" fill="#F8BBD0" stroke="#4A148C" stroke-width="3" />
    <circle cx="285" cy="425" r="8" fill="#F8BBD0" stroke="#4A148C" stroke-width="3" />

    <!-- Brillo superior de la cabeza -->
    <path d="M 175 200 A 75 75 0 0 1 300 160" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" opacity="0.4" />
    <circle cx="320" cy="175" r="5" fill="#FFFFFF" opacity="0.4" />

    <!-- Mejillas sonrojadas infantil -->
    <ellipse cx="185" cy="275" rx="18" ry="12" fill="#FF80AB" opacity="0.6" />
    <ellipse cx="315" cy="275" rx="18" ry="12" fill="#FF80AB" opacity="0.6" />

    <!-- Ojos Kawaii Grandes -->
    <!-- Ojo Izquierdo -->
    <g>
      <circle cx="205" cy="240" r="28" fill="#FFFFFF" stroke="#4A148C" stroke-width="4" />
      <circle cx="210" cy="242" r="16" fill="#1A237E" />
      <!-- Brillos en los ojos -->
      <circle cx="203" cy="233" r="7" fill="#FFFFFF" />
      <circle cx="217" cy="250" r="3" fill="#FFFFFF" />
    </g>

    <!-- Ojo Derecho -->
    <g>
      <circle cx="295" cy="240" r="28" fill="#FFFFFF" stroke="#4A148C" stroke-width="4" />
      <circle cx="290" cy="242" r="16" fill="#1A237E" />
      <!-- Brillos en los ojos -->
      <circle cx="283" cy="233" r="7" fill="#FFFFFF" />
      <circle cx="297" cy="250" r="3" fill="#FFFFFF" />
    </g>

    <!-- Sonrisa amigable -->
    <path d="M 235 270 Q 250 288 265 270" fill="none" stroke="#4A148C" stroke-width="5" stroke-linecap="round" />

    <!-- Lengüita feliz -->
    <path d="M 242 278 Q 250 292 258 278 Z" fill="#FF4081" />

  </g>
</svg>